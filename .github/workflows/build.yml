name: Run Test Case

on: [push]

jobs:
  build:

    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        # .NET 11 is still a preview SDK; include-prerelease is required to install it.
        # Keep this in sync with <TargetFramework> in CSharp.lua.Launcher/CSharp.lua.Launcher.csproj.
        dotnet-version: '11.0.x'
        include-prerelease: true
    - name: clear
      run: dotnet clean --configuration Debug && dotnet nuget locals all --clear
    - name: Build with dotnet
      run: dotnet build --configuration Debug
    - name: Run Test Case
      run: cd test/ & test
      shell: cmd
